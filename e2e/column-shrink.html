<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>column-shrink e2e</title></head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Few columns that all fit on screen, so the column window covers the
      // last column: hiding/pinning/resetting must not read past the end.
      import { createElement as h } from "react";
      import { createRoot } from "react-dom/client";
      import { VirtualGrid } from "/src/lib/index.js";

      const columns = Array.from({ length: 18 }, (_, i) => ({
        key: `c${i}`,
        header: `Col ${i}`,
        width: 140,
        hidden: i >= 9
      }));
      const rows = Array.from({ length: 200 }, (_, r) =>
        Object.fromEntries(columns.map((c, i) => [c.key, `${r}-${i}`]))
      );
      window.__errors = [];
      addEventListener("error", (e) => window.__errors.push(e.message));
      // ?external: the app's own Columns button in a separate toolbar
      const external = location.search.includes("external");
      const grid = h(VirtualGrid, {
        rows,
        columns,
        height: 500,
        columnManager: external ? "page-columns" : true
      });
      const toolbar = h(
        "div",
        { style: { display: "flex", justifyContent: "flex-end", gap: "8px", padding: "16px" } },
        h("button", { type: "button" }, "Filters"),
        h("button", { type: "button", id: "my-columns", popoverTarget: "page-columns" }, "Columns")
      );
      createRoot(document.getElementById("root"), {
        onUncaughtError: (e) => window.__errors.push(e.message)
      }).render(external ? h("div", null, toolbar, grid) : grid);
    </script>
  </body>
</html>
