name: Publish to npm

# Every merge to main that touches the library publishes a new version.
# Version: package.json's if you bumped it (minor/major), else latest on npm + patch.
on:
  push:
    branches: [main]
    paths:
      - "src/lib/**"
      - "index.d.ts"
      - "package.json"
      - "vite.config.js"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false # one publish at a time, none skipped

permissions:
  contents: write # push the version tag
  id-token: write # npm trusted publishing (no npm token needed) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # ships npm 11, required for trusted publishing
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Pick version
        # ponytail: plain x.y.z only; prerelease versions (1.2.0-beta.1) need real semver parsing
        run: |
          name=$(node -p 'require("./package.json").name')
          current=$(node -p 'require("./package.json").version')
          latest=$(npm view "$name" version 2>/dev/null || echo 0.0.0)
          next=$(node -e '
            const [cur, pub] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            const bumped = cur[0] - pub[0] || cur[1] - pub[1] || cur[2] - pub[2];
            console.log(bumped > 0 ? cur.join(".") : [pub[0], pub[1], pub[2] + 1].join("."));
          ' "$current" "$latest")
          echo "package.json $current, npm $latest -> publishing $next"
          npm version "$next" --no-git-tag-version --allow-same-version
          echo "VERSION=$next" >> "$GITHUB_ENV"

      - run: npm publish # prepublishOnly runs tests + build

      - name: Tag the published commit
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
